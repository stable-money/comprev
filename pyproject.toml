[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "comprev"
version = "0.1.0"
description = "Phase 1 MF Video Compliance Engine — advisory, fail-safe per-check review of mutual-fund marketing videos"
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.6",
    "typer>=0.12",
    "pyyaml>=6.0",
    "anthropic>=0.40",
    "rich>=13.7",
]

[project.optional-dependencies]
# Heavy ML deps for the real pipelines. Installed separately so the scaffold/CLI
# can be exercised without them. See README for Apple-Silicon notes.
visual = [
    "paddleocr>=3.0",
    "paddlepaddle>=3.0",
    "scenedetect[opencv]>=0.6",
    "opencv-python-headless>=4.9",
    "numpy>=1.26",
    "Pillow>=10.2",
    "imageio-ffmpeg>=0.5",  # static ffmpeg fallback when no system ffmpeg
]
audio = [
    "faster-whisper>=1.0",
    "imageio-ffmpeg>=0.5",  # static ffmpeg fallback when no system ffmpeg
]
dev = [
    "pytest>=8.0",
]
# Web UI backend (FastAPI). Thin wrapper over the engine; no ML deps required
# for the stub flow. Add `,visual,audio` for real runs.
web = [
    "fastapi>=0.110",
    "uvicorn[standard]>=0.29",
    "python-multipart>=0.0.9",
    "sse-starlette>=2.1",
]

[project.scripts]
comprev = "comprev.cli:app"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
comprev = ["py.typed"]
